<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Godthrone | Lore Menu</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Acme&family=Lexend+Exa:wght@100..900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/global.css">

    <style>
        /* Forces Lore images to be circles and stops the vertical stretch */
        .img-avatar {
            height: 50px !important;
            object-fit: cover !important;
            border-radius: 50% !important;
        }
        
        /* Ensures cards stay consistent with the main menu look */
        .card {
            height: 250px !important;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="menu-panel">
        <button class="menu-toggle" onclick="toggleMenu()">☰ MENU</button>
        <div id="menuContent">
          <a href="../mainmenu.html">Home</a>
          <a href="../browsergame/browsergame.html">Browser Game</a>
          <a href="../novels/storymenu.html">Novels</a>
        </div>
    </div>

    <div class="container">
        <nav class="breadcrumb">
            <a href="../mainmenu.html">HOME</a>
            <span class="separator">/</span>
            <a href="./loremenu.html">LORE</a>
            <span class="separator">/</span>
            <span class="current">CHOOSE YOUR MYTHOS</span>
        </nav>



        <div class="interface">
            <a href="mythosofgodthrone/mythos.html" class="card">
                <img src="../image/mythosofgodthrone/exiliumarch/arma.png" class="img-avatar">
                <h3>Mythos</h3>
                <p class="line-1">Creation Lore</p>
                <p class="line-2">The Beginning</p>
                <p class="line-3">Ancient History</p>
            </a>
  
            <a href="powersystem/powersystemmenu.html" class="card">
                <img src="../image/powersystem/anti-magic/tearsofrebirth.png" class="img-avatar">
                <h3>Power System</h3>
                <p class="line-1">Magic & Steel</p>
                <p class="line-2">Abilities</p>
                <p class="line-3">Energy Flows</p>
            </a>

            <a href="worldbuilding/worldbuildingmenu.html" class="card">
                <img src="../image/worldbuilding/mundus/mundus1.png" class="img-avatar">
                <h3>Worldbuilding</h3>
                <p class="line-1">The Continent</p>
                <p class="line-2">Geography</p>
                <p class="line-3">Territories</p>
            </a>
        </div>

       <button class="scroll-to-top" id="scrollToTop" onclick="scrollToTop()" style="display: none; align-items: center; justify-content: center;">↑</button>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('menuContent');
            menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
        }

        // The Scroll Logic
        window.onscroll = function() {
            const btn = document.getElementById("scrollToTop");
            if (document.body.scrollTop > 100 || document.documentElement.scrollTop > 100) {
                // Force it to show using Protocol Pink if the CSS fails
                btn.style.display = "flex"; 
                btn.style.background = "#000000";
                btn.style.border = "1px solid #ff6b9d";
                btn.style.color = "#ff6b9d";
            } else {
                btn.style.display = "none";
            }
        };

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
